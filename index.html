<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 动态日报 · 中美 AI 科技新闻</title>
<meta name="description" content="每天汇总的中美 AI 科技新闻：模型、芯片、资本、安全与政策，简洁直达原文。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="mast-inner">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <h1>AI 动态日报</h1>
        <p class="tagline">中美 AI 科技新闻 · 模型 / 芯片 / 资本 / 安全 / 政策</p>
      </div>
    </div>
    <div class="mast-meta">
      <span id="updatedAt">加载中…</span>
      <span id="totalCount"></span>
    </div>
  </div>
  <nav class="daynav" id="dayNav" aria-label="按日期跳转"></nav>
</header>

<main id="app" class="wrap">
  <p class="loading">正在加载最新一期…</p>
</main>

<section id="archiveView" class="wrap" hidden></section>

<footer class="foot wrap">
  <p>本站每天更新两次（约 12:30 与 21:30，北京时间），内容汇总自当天的 AI 科技动态，每条均附原文链接。</p>
  <p class="foot-sub">AI 动态日报 · 由 Muse 每日整理发布</p>
</footer>

<button class="cal-fab" id="calFab" aria-label="打开或关闭日历">📅</button>
<aside class="cal-float" id="calFloat" aria-label="按日期查历史新闻">
  <div class="cal-head">
    <button id="calPrev" class="cal-btn" aria-label="上个月">‹</button>
    <h2 id="calTitle">历史日历</h2>
    <button id="calNext" class="cal-btn" aria-label="下个月">›</button>
  </div>
  <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
  <div class="cal-grid" id="calGrid"></div>
</aside>
<button class="top-btn" id="topBtn" aria-label="回到最顶端">↑</button>

<script src="app.js"></script>
</body>
</html>
